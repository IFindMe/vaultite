# Vaultite server in Docker Compose. Run from the repo root:
#   docker compose -f docker/compose.yaml up -d
# then open http://localhost:8793
#
# The app needs Node >= 23.6; the image base is node:24-bookworm.
# The vault lives in a named volume mounted at /app/vault.

services:
  vaultite:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vaultite
    ports:
      - "8793:8793"
    volumes:
      - vaultite-vault:/app/vault
    # The app refuses requests whose Host isn't local to it ("this app
    # doesn't answer for <host>", server.ts foreign()). Name the machine's
    # host you reach it by here; localhost/127.0.0.1 always works.
    environment:
      VAULTITE_HOSTS: "vaultite.skink-platy.ts.net"

volumes:
  vaultite-vault:
