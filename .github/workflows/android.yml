# The Android app (android/): an APK. Release's android job calls it for each release (the APK goes on the GitHub
# release); a push to main that changes the app's shell builds it too, so a break shows the day it's made.
# Secrets: ANDROID_KEYSTORE (the release key's .jks, base64) and ANDROID_KEYSTORE_PASSWORD (the store's and the key's).
# Without them the APK is signed with a throwaway debug key, and a phone can't update an installed one to it.
name: Android
on:
  push:
    branches: [main]
    paths: [android/**, web/phone.html, web/src/phone.tsx, web/src/core/phoneapp.ts, capacitor.config.json, .github/workflows/android.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
concurrency:
  group: android-${{ github.ref }}-${{ inputs.version || 'build' }}
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          VAULTITE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          v=${VERSION:-$(node -p 'require("./package.json").version')-dev.$(date -u +%Y%m%d%H%M)}
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/vaultite.jks"
            export VAULTITE_ANDROID_KEYSTORE="$RUNNER_TEMP/vaultite.jks"
          else
            echo "::warning::ANDROID_KEYSTORE isn't set: the APK is signed with a debug key"
          fi
          # (minutes since 1970: rises with every build, and fits Android's versionCode, an int, until the year 6053)
          export VAULTITE_ANDROID_VERSION_NAME="$v" VAULTITE_ANDROID_VERSION_CODE=$(( $(date +%s) / 60 ))
          npm run android:release
          mkdir -p dist-app
          case "$v" in *-nightly.*) name="Vaultite-Nightly-$v.apk" ;; *) name="Vaultite-$v.apk" ;; esac
          mv android/app/build/outputs/apk/release/app-release.apk "dist-app/$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          if-no-files-found: error
          path: dist-app/*.apk
