apply plugin: 'com.android.application'

// The version and the signing key come from the build (.github/workflows/release.yml, android); a build without a key
// is signed with the debug key.
def env = System.getenv()

android {
    namespace = "app.vaultite.android"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.vaultite.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((env.VAULTITE_ANDROID_VERSION_CODE ?: "1") as int)
        versionName env.VAULTITE_ANDROID_VERSION_NAME ?: "0.0.0-dev"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (env.VAULTITE_ANDROID_KEYSTORE) {
                storeFile file(env.VAULTITE_ANDROID_KEYSTORE)
                storePassword env.VAULTITE_ANDROID_KEYSTORE_PASSWORD
                keyAlias env.VAULTITE_ANDROID_KEY_ALIAS ?: "vaultite"
                keyPassword env.VAULTITE_ANDROID_KEYSTORE_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig env.VAULTITE_ANDROID_KEYSTORE ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
